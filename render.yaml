# Render Blueprint for RoleQuill. In Render: New > Blueprint > pick your repo.
# Render reads this, provisions the service + persistent disk, and prompts you to
# enter the secret env vars (marked sync:false).
services:
  - type: web
    name: rolequill
    runtime: python
    plan: starter            # required for a persistent disk (free tier is ephemeral)
    buildCommand: pip install -r requirements.txt
    # -w 1: one worker keeps memory low on the 512MB Starter instance (a search
    # holds many job descriptions in RAM). Threads handle concurrent requests.
    startCommand: gunicorn -w 1 --threads 8 --timeout 120 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /auth/login
    disk:
      name: data
      mountPath: /var/data                       # SQLite db + resumes + Excel exports
      sizeGB: 1
    envVars:
      - key: ROLEQUILL_DATA_DIR                   # write all data onto the disk
        value: /var/data
      - key: ROLEQUILL_DEBUG
        value: "0"
      - key: ROLEQUILL_HTTPS
        value: "1"
      - key: ROLEQUILL_BEHIND_PROXY
        value: "1"
      - key: ROLEQUILL_PAYMENTS_MODE
        value: stripe
      - key: ROLEQUILL_GOOGLE_PAGES
        value: "1"
      # memory-bound the search on the 512MB instance (fewer boards, less parallelism)
      - key: JOBSEARCH_MAX_COMPANIES
        value: "25"
      - key: JOBSEARCH_WORKERS
        value: "6"
      # secrets — entered in the Render dashboard, never committed
      - key: ROLEQUILL_SECRET
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
