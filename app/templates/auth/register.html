{% extends "base.html" %}
{% block title %}Sign up — RoleQuill{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Create your account</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Full name<input type="text" name="full_name" placeholder="Used to title your Excel report"></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></label>
    <label class="consent">
      <input type="checkbox" name="consent" value="1" required>
      <span>I agree to the
        <a href="{{ url_for('main.terms') }}" target="_blank">Terms of Service</a> and
        <a href="{{ url_for('main.privacy') }}" target="_blank">Privacy Policy</a>.</span>
    </label>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
