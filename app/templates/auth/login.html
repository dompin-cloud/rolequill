{% extends "base.html" %}
{% block title %}Log in — RoleQuill{% endblock %}
{% block content %}
<div class="auth-card">
  <h2>Log in</h2>
  <form method="post">
    <label>Email<input type="email" name="email" required autofocus></label>
    <label>Password<input type="password" name="password" required></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
